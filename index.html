<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>灵基演算 测试版</title>
<style>
/* 版式：沿用自走棋通行的桌面布局——左侧御主列表；中间自上而下是召唤阵操作、商店、战线、御主栏、备战席。窄屏时御主列表移到顶部。
   素材在 assets/；特效是纯黑底图，放在桌面这一层用滤色混合 */
:root {
  --bg: #0b1020; --panel: #121a33e6; --panel2: #18223f; --line: #2a3760;
  --text: #e8ecf7; --sub: #9aa6c4; --faint: #66729a;
  --gold: #d9b35b; --cyan: #57d2e6; --red: #e0524f; --green: #4fbf7a;
  --piece: 84px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; color: var(--text); font: 14px/1.5 "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
body { background: var(--bg); padding: env(safe-area-inset-top, 0) max(8px, env(safe-area-inset-right, 0px)) 16px max(8px, env(safe-area-inset-left, 0px)); }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: linear-gradient(#1a2440a0, #141c34c8), url(assets/bg/训练场_竖.webp) center / cover no-repeat; filter: saturate(.75); }
@media (min-width: 720px) { body::before { background-image: linear-gradient(#1a244098, #141c34c0), url(assets/bg/训练场_横.webp); } }
#app { max-width: 1060px; margin: 0 auto; }
button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
button:hover { border-color: var(--cyan); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.img { border: 0; border-radius: 0; background: center / 100% 100% no-repeat; padding: 8px 18px; font-weight: 700; text-shadow: 0 1px 2px #000a; min-height: 38px; }
button.primary { background-image: url(assets/ui/按钮_主要.webp); color: #2a1a00; text-shadow: 0 1px 0 #fff6; }
button.second { background-image: url(assets/ui/按钮_次要.webp); }
button.danger { background-image: url(assets/ui/按钮_危险.webp); }
button.on { box-shadow: 0 0 0 2px var(--gold); }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
h1 { font-size: 26px; margin: 0; letter-spacing: .08em; }
.muted { color: var(--sub); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--sub); display: inline-flex; align-items: center; gap: 3px; }
.chip.gold { color: var(--gold); border-color: var(--gold); }
.chip.cyan { color: var(--cyan); border-color: var(--cyan); }
.chip img, .bond img { width: 16px; height: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.vol { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--sub); flex-wrap: wrap; }
.vol input { width: 64px; }

/* 桌面 */
.table { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; margin-top: 8px; padding: 10px; border-radius: 16px;
  background: radial-gradient(ellipse at 50% 40%, #34476fd9, #222f4fe6 75%); border: 2px solid #8c7438; box-shadow: 0 0 0 1px #000, inset 0 0 40px #0008; position: relative; }
/* SVG 框（assets/ui/svg/）：之后有美术图可以直接替换同名文件 */
.framed { border: 18px solid transparent; border-image: url(assets/ui/svg/面板框.svg) 20 fill / 18px stretch; }
.players { display: flex; flex-direction: column; gap: 6px; margin: -4px; padding: 0; border-width: 14px; align-self: start; }
.pl { position: relative; text-align: center; font-size: 11px; line-height: 1.25; }
.pl .av { position: relative; width: 66px; height: 66px; margin: 0 auto; }
.pl .av img { position: absolute; inset: 8.5%; width: 83%; height: 83%; clip-path: polygon(14% 0, 86% 0, 100% 14%, 100% 86%, 86% 100%, 14% 100%, 0 86%, 0 14%); background: #26305a; }
.pl .av::after { content: ""; position: absolute; inset: 0; background: url(assets/ui/svg/头像框.svg) center / 100% 100% no-repeat; pointer-events: none; }
.pl.next .av::after { background-image: url(assets/ui/svg/头像框_对手.svg); }
.pl .av img { object-fit: cover; object-position: 50% 14%; display: block; }
.pl.out { opacity: .35; }
.pl .hpb { height: 5px; width: 64px; margin: 3px auto 0; background: #2a3150; border-radius: 3px; overflow: hidden; }
.pl .hpb i { display: block; height: 100%; background: var(--green); }
.pl .tag { position: absolute; top: -6px; right: -4px; z-index: 1; font-size: 10px; background: var(--cyan); color: #04212a; border-radius: 6px; padding: 0 4px; font-weight: 800; }
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 0 4px 10px; border-width: 14px; }
.topbar .left { display: flex; justify-content: flex-end; }
.topbar .right { display: flex; gap: 10px; }
.rbtn { position: relative; width: 66px; height: 66px; border-radius: 50%; padding: 0; display: grid; place-items: center; background: url(assets/ui/svg/按钮环.svg) center / 100% 100% no-repeat; border: 0; font-size: 11px; line-height: 1.1; }
.rbtn:hover { filter: brightness(1.15); }
.rbtn img { width: 40px; height: 40px; }
.rbtn .ico { font-size: 22px; line-height: 1; color: var(--cyan); }
.rbtn .lbl { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); white-space: nowrap; color: var(--sub); font-size: 11px; }
.rbtn .c { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); min-width: 22px; height: 22px; border-radius: 11px; background: linear-gradient(#f0d38c, #b8913a); color: #2a1a00; font-weight: 800; font-size: 12px; display: grid; place-items: center; padding: 0 5px; }
.tierbox { text-align: center; }
.tierbox img { width: 76px; height: 76px; display: block; margin: 0 auto; filter: drop-shadow(0 0 8px #57d2e688); }
@media (prefers-reduced-motion: no-preference) { .tierbox img { animation: spin 40s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }
.tierbox b { color: var(--gold); }
.zone { position: relative; border-radius: 12px; padding: 18px 8px 10px; min-height: calc(var(--piece) * 1.22 + 20px); }
.zone .zl { position: absolute; top: 3px; left: 10px; font-size: 11px; color: var(--faint); pointer-events: none; }
.shopzone { background: url(assets/ui/商店底板.webp) center / 100% 100% no-repeat; padding-top: 16px; }
.boardzone { background: url(assets/ui/战线台座.webp) center bottom / 100% 32% no-repeat; padding-bottom: 20px; }
.benchzone { background: url(assets/ui/商店底板.webp) center / 100% 100% no-repeat; padding-top: 16px; }
.zone.drop { box-shadow: 0 0 0 2px var(--cyan) inset; }
.zone.sell { box-shadow: 0 0 0 2px var(--red) inset; }
.zone.sell::after { content: "松手送还（+1 魔力）"; position: absolute; inset: 0; display: grid; place-items: center; background: #3a101899; color: #ffd0c8; font-weight: 800; border-radius: 12px; }
.line { display: flex; justify-content: center; gap: 8px; flex-wrap: nowrap; }
.line > * { width: var(--piece); flex: 0 0 var(--piece); }
.benchline > * { width: calc(var(--piece) * .78); flex-basis: calc(var(--piece) * .78); }
.hud { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; }
.master { display: flex; align-items: center; gap: 8px; }
.master .face { position: relative; width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--gold); background: #0b1020 center / 80% no-repeat; box-shadow: 0 0 12px #d9b35b55; }
.master .hpd { position: absolute; bottom: -6px; right: -6px; min-width: 30px; height: 30px; border-radius: 15px; background: radial-gradient(#d24a3a, #7a1a12); border: 2px solid #f0c08a; display: grid; place-items: center; font-weight: 900; font-size: 13px; padding: 0 4px; }
.skill { width: 54px; height: 54px; border-radius: 50%; padding: 0; background: radial-gradient(#2b3d78, #121a33); border: 2px solid var(--cyan); font-size: 11px; line-height: 1.15; }
.seals { display: flex; gap: 3px; }
.seal { width: 18px; height: 26px; background: #c22b4b; clip-path: polygon(50% 0, 100% 35%, 70% 100%, 30% 100%, 0 35%); }
.seal.used { background: #3a2530; }
.mana { text-align: right; }
.mana .gems { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 1px; max-width: 170px; margin-left: auto; }
.mana .gems img { width: 16px; height: 16px; }
.mana .gems img.off { opacity: .2; filter: grayscale(1); }
.mana b { color: var(--cyan); font-size: 16px; }
.bonds { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.bond { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); color: var(--faint); display: inline-flex; align-items: center; gap: 4px; }
.bond.lv { color: var(--text); border-color: var(--gold); }
.bond small { color: var(--sub); }
.endbtn { justify-self: end; }
@media (max-width: 760px) {
  :root { --piece: calc((100vw - 16px - 20px - 16px - 36px) / 7); }
  .table { grid-template-columns: minmax(0, 1fr); padding: 8px; }
  .players { flex-direction: row; justify-content: space-between; }
  .pl .av { width: 46px; height: 46px; }
  .pl .hpb { width: 46px; }
  .players { gap: 2px; border-width: 10px; }
  .pl { min-width: 0; flex: 1 1 0; }
  .pl .pn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line { gap: 6px; }
  .shopline { flex-wrap: wrap; }
  .benchline > * { width: calc(var(--piece) * .9); flex-basis: calc(var(--piece) * .9); }
  .benchline { flex-wrap: wrap; }
  .hud { grid-template-columns: minmax(0, 1fr); }
  .hud .master { justify-content: center; }
  .hud .mana { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
  .rbtn { width: 56px; height: 56px; }
  .tierbox img { width: 60px; height: 60px; }
}

/* 棋子 */
.slot { aspect-ratio: 1 / 1.22; border: 1px dashed #3a4a7a88; border-radius: 10px; min-width: 0; }
.piece { position: relative; aspect-ratio: 1 / 1.22; cursor: grab; min-width: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
.piece .sq { position: relative; aspect-ratio: 1; }
.piece .art { position: absolute; inset: 9%; border-radius: 6px; overflow: hidden; background: #26305a; }
.piece .art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 14%; display: block; pointer-events: none; }
.piece .art .ph { width: 100%; height: 100%; display: grid; place-items: center; font-size: 12px; color: var(--sub); text-align: center; padding: 2px; }
.piece .art.holo img { filter: grayscale(1) brightness(1.2) contrast(1.15); object-position: 50% 30%; }
.piece .art.holo::before { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, #57d2e6, #2a6fd0); mix-blend-mode: color; }
.piece .art.holo::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(transparent 0 2px, #57d2e62e 2px 3px); }
.piece .frm { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.piece .frm.goldf { inset: -6%; width: 112%; height: 112%; }
.piece .gem { position: absolute; top: -12%; left: 50%; width: 26%; transform: translateX(-50%); }
.piece .gem img { width: 100%; display: block; }
.piece .gem span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
.piece .npi { position: absolute; top: 3%; right: 3%; width: 24%; }
.piece .pact, .piece .smn { position: absolute; top: 3%; left: 3%; width: 22%; }
.piece .asc { position: absolute; top: 26%; right: 3%; width: 20%; }
.piece .atk, .piece .hp { position: absolute; bottom: -7%; width: 34%; aspect-ratio: 1; display: grid; place-items: center; font-weight: 800; font-size: 12px; font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; background: center / contain no-repeat; }
.piece .atk { left: -5%; background-image: url(assets/ui/攻击.webp); }
.piece .hp { right: -5%; background-image: url(assets/ui/体力.webp); }
.piece .hp.hurt { color: #ffb3a8; }
.piece .marks { position: absolute; top: 26%; left: 0; display: flex; flex-direction: column; gap: 1px; z-index: 2; }
.piece .marks i { font-style: normal; font-size: 9px; line-height: 12px; padding: 0 3px; border-radius: 4px; background: #0b1020cc; color: var(--cyan); }
.piece .kw { position: absolute; bottom: -4%; left: 50%; transform: translateX(-50%); display: flex; gap: 1px; z-index: 2; }
.piece .kw svg { width: 15px; height: 15px; display: block; background: #0b1020e6; border-radius: 50%; padding: 1.5px; border: 1px solid currentColor; }
.lblk { font-weight: 700; padding: 0 2px; border-radius: 3px; background: #ffffff14; }
.piece .nm { margin-top: 2px; font-size: 10px; line-height: 13px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; text-shadow: 0 1px 2px #000; }
.piece.sel .sq { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 8px; }
.piece.target .sq { outline: 2px dashed var(--gold); outline-offset: 2px; border-radius: 8px; }
.piece.dim, .piece.dying { opacity: .5; }
.piece.dragging { opacity: .25; }
.ghost { position: fixed; z-index: 60; pointer-events: none; width: var(--piece); transform: translate(-50%, -60%) scale(1.08); filter: drop-shadow(0 8px 12px #000c); }
.ins { width: 4px !important; flex: 0 0 4px !important; background: var(--cyan); border-radius: 2px; box-shadow: 0 0 8px var(--cyan); }
.cost { position: absolute; top: -6px; right: -4px; font-size: 10px; background: var(--gold); color: #1a1405; border-radius: 6px; padding: 0 4px; font-weight: 800; z-index: 3; }
/* 概念礼装卡：fgo.wiki 的礼装图标 + 礼装格底框 */
.cecard { position: relative; aspect-ratio: 1 / 1.22; cursor: grab; min-width: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
.cecard .sq { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #2a1f45; box-shadow: 0 0 0 2px #b48cff, 0 0 10px #b48cff66; }
.cecard .sq img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.cecard .tier { position: absolute; top: 2px; left: 2px; font-size: 9px; font-weight: 800; padding: 0 4px; border-radius: 4px; background: #0b1020cc; color: #d8c4ff; }
.cecard .nm { margin-top: 2px; font-size: 10px; line-height: 13px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; color: #e4d6ff; text-shadow: 0 1px 2px #000; }
.cecard.sel .sq { outline: 2px solid var(--cyan); outline-offset: 2px; }
.cecard.dragging { opacity: .25; }
.cehand { display: flex; gap: 6px; align-items: center; }
.cehand .zl2 { font-size: 11px; color: var(--faint); writing-mode: vertical-rl; }
.cehand .slotc { width: calc(var(--piece) * .62); aspect-ratio: 1 / 1.22; border: 1px dashed #8a6ccf88; border-radius: 8px; }
.cehand .cecard { width: calc(var(--piece) * .62); }
.zone.cehand-zone { min-height: 0; padding: 6px; border-radius: 10px; }
.piece.aim .sq { outline: 3px solid #b48cff; outline-offset: 2px; border-radius: 8px; box-shadow: 0 0 14px #b48cff; }
.piece.fuse .sq { outline: 3px solid #9fd0ff; outline-offset: 2px; border-radius: 8px; box-shadow: 0 0 14px #9fd0ff; }
/* 主持人 */
.host { position: relative; display: flex; align-items: center; gap: 6px; margin-right: auto; }
.host .hav { width: 54px; height: 54px; border-radius: 50%; overflow: hidden; border: 2px solid var(--gold); background: #26305a; flex: 0 0 54px; }
.host .hav img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 14%; }
.host .bubble { position: absolute; left: 60px; top: 50%; transform: translateY(-50%); z-index: 20; width: max-content; max-width: min(240px, 46vw); padding: 6px 10px; border-radius: 10px; background: #fff8e8; color: #2a1a00; font-size: 12px; line-height: 1.4; box-shadow: 0 4px 14px #000a; pointer-events: none; opacity: 0; transition: opacity .2s; }
.host .bubble.on { opacity: 1; }
.host .bubble::before { content: ""; position: absolute; left: -6px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-left: 0; border-right-color: #fff8e8; }
.hostline { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.hostline img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; object-position: 50% 14%; border: 2px solid var(--gold); }
.hostline span { background: #fff8e8; color: #2a1a00; border-radius: 10px; padding: 4px 10px; font-size: 13px; }
.hostpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.start .hostpick label { display: flex; gap: 6px; align-items: center; margin: 0; padding: 6px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); cursor: pointer; }
.start .hostpick label.locked { opacity: .45; cursor: not-allowed; }
.hostpick img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; object-position: 50% 14%; }

/* 特效与飘字 */
.fx { position: absolute; pointer-events: none; mix-blend-mode: screen; background: center / contain no-repeat; z-index: 8; animation: pop var(--d, .5s) ease-out forwards; }
.fx.seq { background-size: 400% 100%; background-position: 0 0; animation: seq var(--d, .5s) steps(3) forwards; }
@keyframes pop { 0% { transform: scale(.55); opacity: 0; } 25% { opacity: 1; } 100% { transform: scale(1.15); opacity: 0; } }
@keyframes seq { from { background-position: 0 0; } to { background-position: 100% 0; } }
.dmg { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font-weight: 900; font-size: 20px; color: #fff; text-shadow: 0 0 3px #b5392a, 0 2px 2px #000; z-index: 9; pointer-events: none; animation: float var(--d, .6s) ease-out forwards; }
.dmg.heal { color: #b9f5c9; text-shadow: 0 0 3px #2c8a4a, 0 2px 2px #000; }
@keyframes float { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -28px); opacity: 0; } }
.banner { position: absolute; left: 0; right: 0; top: 45%; transform: translateY(-50%); text-align: center; z-index: 10; pointer-events: none; }
.banner span { display: inline-block; padding: 8px 26px; font-size: 20px; font-weight: 900; color: #fff3cf; background: linear-gradient(90deg, transparent, #6b4a10ee 20%, #6b4a10ee 80%, transparent); text-shadow: 0 0 10px #d9b35b; animation: bannerIn var(--d, .9s) ease-out forwards; }
@keyframes bannerIn { 0% { transform: scaleX(.2); opacity: 0; } 20% { transform: scaleX(1); opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .fx, .dmg, .banner span { animation-duration: .01s; } }

/* 详情浮层、提示、弹窗 */
.detail { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: min(360px, calc(100vw - 24px)); max-height: 60vh; overflow: auto; z-index: 30; background: #141c38f5; border: 1px solid var(--gold); border-radius: 12px; padding: 10px 12px; box-shadow: 0 8px 30px #000c; }
.detail h3 { margin: 0 0 4px; font-size: 16px; padding-right: 24px; }
.detail p { margin: 4px 0; }
.detail .lbl { color: var(--gold); font-weight: 700; margin-right: 4px; }
.detail .x { position: absolute; top: 6px; right: 6px; padding: 0 8px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #2a1f1f; border: 1px solid var(--red); padding: 6px 14px; border-radius: 8px; z-index: 70; max-width: 90vw; }
.modal { position: fixed; inset: 0; background: #05081299; display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal .box { background: var(--panel2); border: 1px solid var(--gold); border-radius: 12px; padding: 14px; width: min(560px, 100%); max-height: 90vh; overflow: auto; }
.disc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.msg { min-height: 34px; padding: 6px; background: #0b1020aa; border-radius: 8px; text-align: center; font-weight: 600; }
.msg.np { color: var(--gold); }
.report { background: url(assets/ui/战报卡.webp) center / 100% 100% no-repeat; padding: 18px; border-radius: 10px; }
.title { display: flex; align-items: center; gap: 10px; margin: 18px 0 4px; }
.title img { width: 56px; height: 56px; }
.start label { display: block; margin: 8px 0 4px; color: var(--sub); }
.start select { width: 100%; }
.start .row select { width: auto; flex: 1 1 140px; min-width: 0; }
.start select, .start input[type=number] { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px; font: inherit; max-width: 100%; }
.rules li { margin: 3px 0; }
.rank { display: flex; align-items: center; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.rank img { width: 40px; height: 40px; }
.mode { color: var(--cyan); font-weight: 700; text-align: center; }
/* 窄屏：主持人的气泡放到头像下面，免得挡住召唤阵 */
@media (max-width: 760px) {
  .host .hav { width: 40px; height: 40px; flex-basis: 40px; }
  .host .bubble { left: 0; top: calc(100% + 8px); transform: none; max-width: 70vw; font-size: 11px; }

const C = window.ChessCore;
const CARD = C.CARD;
const A = 'assets/';
const $app = document.getElementById('app');
let G = null, P = null, sel = null, mode = null, replay = null, toastMsg = '', toastTimer = 0, showRules = false;

// ---------- 酒馆联动 ----------
// 从状态栏「模拟训练场」打开时，状态栏在页面最前面注入 window.LINGJI_CTX：

// 没有它时就是独立的测试版，战绩存在浏览器里。
const CTX = window.LINGJI_CTX || null;
const ACHV0 = { games: 0, wins: 0, best: 0, maxRefresh: 0, maxTriples: 0, champTier6: false, champDeath: false };

// 契约英灵 → 卡表里的唯一名：按原名（fgo.wiki 页面名）或真名找，多个版本时按职阶挑；卡表外的暂时不进卡池
// fgo.wiki 页面名可能带「(Saber)」这样的后缀，比较前去掉
const bare = n => String(n || '').replace(/\s+/g, '').replace(/[(（][^)）]*[)）]$/, '');
function cardOfContract(c) {
  const names = [c.wiki, c.name].filter(Boolean).map(bare);

  if (list.length > 1 && c.cls) { const same = list.filter(x => x.c.toLowerCase() === String(c.cls).toLowerCase()); if (same.length) list = same; }

const PACT = CTX ? (CTX.contracts || []).map(c => ({ ...c, key: cardOfContract(c) })) : [];

const result = (r, okSound) => { if (!r || !r.ok) { play('错误'); toast(r ? r.msg : '操作失败'); return false; } if (okSound) play(okSound); return true; };

// ---------- 音效（Web Audio）与语音（fgo.wiki 的原作语音，直接播放） ----------
const SFX_KEYS = ['点击', '购买', '出售', '刷新', '固定', '上阵', '升级', '三合一', '选卡', '令咒', '升华', '礼装', '技能', '错误', '挥砍', '命中', '重击', '回避', '护盾', '护盾破碎', '无敌', '毅力', '召唤物', '阵亡', '宝具', '爆炸', '削弱', '回复', '眩晕', '胜利', '失败', '平局', '冠军', '出局'];

// ---------- 棋子 ----------
const SUMMON_ART = { 龙牙兵: '敌人_龙牙兵.png', 幼龙: '敌人_幼龙.png', 眷属: '敌人_眷属.png', 青铜人偶: '敌人_青铜人偶.png', 傀儡: '敌人_傀儡.png', 蒸汽机兵: '敌人_蒸汽机兵.png', 蒸汽齿轮: '蒸汽齿轮.webp', 机神装甲: '机神装甲.webp', 向日葵: '向日葵.webp', 妖精: '妖精.webp' };

const KW = {

  整备: ['#6fd38f', '<path d="M4 2.5h8M4 13.5h8M5 2.5c0 3.5 3 4.5 3 5.5s-3 2-3 5.5M11 2.5c0 3.5-3 4.5-3 5.5s3 2 3 5.5"/>'],
  送还: ['#e9c46a', '<path d="M12.6 8.6A4.6 4.6 0 1 1 8 3.4M7.6 1.4 9.8 3.4 7.6 5.4"/>'],
  归座: ['#b99bff', '<path d="M8 2.5V10M4.8 7 8 10.3 11.2 7M3 13.4h10"/>'],

  吞噬: ['#ff7b7b', '<path d="M2.5 6c2 4.5 9 4.5 11 0M4 6l1.2 2.3L6.6 6 8 8.3 9.4 6l1.4 2.3L12 6"/>'],
  吸收: ['#f59ac8', '<path d="M8 2.5c2.6 3 4 5 4 7a4 4 0 0 1-8 0c0-2 1.4-4 4-7z"/>'],

const kwIcons = ab => {
  const list = Object.keys(KW).filter(k => ab.includes('【' + k + '】'));
  return list.length ? `<div class="kw">${list.map(k => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:${KW[k][0]}"><title>${k}</title>${KW[k][1]}</svg>`).join('')}</div>` : '';

function pieceHTML(u, opts = {}) {

// ---------- 主持人（相当于酒馆老板，只负责演出）与成就 ----------
const HOSTS = (C.DATA.hosts || { list: [] }).list, HEV = (C.DATA.hosts || {}).events || {};
// 解锁条件：对局结束时统一判断（说明文字在 tools/hosts.cjs）
const HOST_TEST = { davinci: () => true, waver: s => s.games >= 5, bb: s => s.maxRefresh >= 30, gil: s => s.champTier6, merlin: s => s.champDeath, qianqian: s => s.maxTriples >= 5, ritsuka: s => s.games >= 10 };

const unlocked = id => HOST_TEST[id] && HOST_TEST[id](achv());

function playUrl(url) {
  if (!url || SFX.muted || !SFX.voice || !SFX.vol) return;
  try { if (SFX.cur) SFX.cur.pause(); const a = new Audio(url); a.volume = Math.min(1, SFX.vol * 1.3); a.play().catch(() => {}); SFX.cur = a; } catch (e) { /* 播放失败就只显示台词 */ }
}
// 主持人说一句：高优先级可以打断正在说的低优先级；低优先级有冷却，刷新类按概率触发
function hostSay(ev) {
  const hst = curHost();
  if (!hostState.on || !hst || !hst.lines[ev]) return;
  const [pri, cat] = HEV[ev] || [0, '对话'];
  const now = Date.now();
  if (now < hostState.until && pri <= hostState.pri) return;
  if (pri === 0 && now - (hostState.last[ev] || 0) < 9000) return;
  if (ev === '刷新' && Math.random() < 0.65) return;

  const lines = hst.lines[ev];
  hostState.text = lines[Math.floor(Math.random() * lines.length)];
  hostState.pri = pri; hostState.until = now + 3800;
  const clips = hst.voice && hst.voice[cat];
  if (clips && clips.length) playUrl(clips[Math.floor(Math.random() * clips.length)]);
  hostShow();
  clearTimeout(hostState.timer);
  hostState.timer = setTimeout(() => { hostState.text = ''; hostState.pri = -1; hostShow(); }, 3800);
}
function hostShow() {
  const b = document.querySelector('.host .bubble');
  if (!b) return;
  b.textContent = hostState.text;
  b.classList.toggle('on', !!hostState.text);
}
const hostHTML = () => { const hst = curHost(); return hostState.on && hst ? `<div class="host" title="主持人：${esc(hst.name)}"><div class="hav"><img src="${hostImg(hst)}" alt="" referrerpolicy="no-referrer"></div><div class="bubble ${hostState.text ? 'on' : ''}">${esc(hostState.text)}</div></div>` : ''; };
// 长时间不操作：闲置吐槽（页面在后台时不说）
setInterval(() => {

}, 5000);
// 对局结束：记成就、解锁主持人
function recordGame() {

  const s = achv();
  s.games++;
  if (P.place === 1) s.wins++;
  s.best = s.best ? Math.min(s.best, P.place || 9) : P.place || 9;
  s.maxRefresh = Math.max(s.maxRefresh, P.refreshes || 0);
  s.maxTriples = Math.max(s.maxTriples, P.triples || 0);
  if (P.place === 1) {
    if (P.tier >= 6) s.champTier6 = true;
    const deathy = P.board.filter(u => { const c = CARD[u.key]; return /【归座】|召唤/.test(c.ab) || c.np.tr === '归座' || /召唤/.test(c.np.fx); }).length;

  }
  if (CTX) CTX.record = s; else store.set('achv', s);

}
// 交给状态栏：先放进本地队列（状态栏不在时下次打开再处理），再请状态栏立刻写进变量
const PENDING = 'lingji_pending';
function gameResult() {
  const list = G.players.slice().sort((a, b) => (a.place || 9) - (b.place || 9));
  return {
    id: `${G.seed}-${G.startedAt}`, at: Date.now(), place: P.place, total: G.players.length, rounds: G.round, tier: P.tier,

  const npTop = Object.entries(r.np).sort((a, b) => b[1] - a[1])[0];

    `【灵基演算战报】刚在模拟训练场的终端上打完一局「灵基演算」（${r.total} 人联机）：第 ${r.place} 名，打到第 ${r.rounds} 回合。`,

}
// 新种族先用 SVG 徽记（assets/tribe/*.svg），有美术图后换成同名 webp
const SVG_TRIBES = ['鬼', '中华', 'Saber脸', '樱系列', '平行世界'];
const tribeIcon = t => (C.DATA.tribes[t] ? `<img src="${A}tribe/${t}.${SVG_TRIBES.includes(t) ? 'svg' : 'webp'}" alt="">` : '');
const STAFF = ['格林', '芊芊', '藤丸立香'];
const avatarOf = p => (p.human ? `${A}master/${(C.SKILLS.find(s => s.n === p.skill) || {}).suit || '迦勒底制服'}.png` : STAFF.includes(p.name) ? `${A}master/${p.name}.jpg` : CARD[p.name] ? CARD[p.name].img : `${A}master/格林.jpg`);

// ---------- 开始页 ----------
// 酒馆里：契约英灵直接取自变量，好感高的 3 名进卡池；卡表里的契约英灵也可能坐到对面
function pactHTML() {
  const inPool = PACT.filter(p => p.key).slice(0, 3);

let drag = null, suppressClick = false;

  if (!drag) return;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    drag.on = true;
    drag.ghost = drag.el.cloneNode(true);
    drag.ghost.classList.add('ghost');
    document.body.appendChild(drag.ghost);
    drag.el.classList.add('dragging');
    sfxInit();
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX + 'px';
  drag.ghost.style.top = e.clientY + 'px';
  const z = zoneAt(e.clientX, e.clientY);
  document.querySelectorAll('.zone').forEach(n => n.classList.remove('drop', 'sell'));
  document.querySelectorAll('.ins').forEach(n => n.remove());
  document.querySelectorAll('.piece.aim, .piece.fuse').forEach(n => n.classList.remove('aim', 'fuse'));
  if (!z) return;
  const kind = drag.src.split(':')[0];
  // 礼装：指着的从者高亮；从商店拖向礼装栏时礼装栏高亮
  if (kind === 'ce' || kind === 'hand') {
    if (z.dataset.zone === 'cehand' && kind === 'ce') z.classList.add('drop');
    const pc = pieceUnder(e.clientX, e.clientY);

  if (fz) { fz.classList.add('fuse'); return; }
  if (z.dataset.zone === 'shop' && kind !== 'shop') z.classList.add('sell');
  else if (z.dataset.zone !== 'shop' && !(kind === 'board' && z.dataset.zone === 'bench')) {
    z.classList.add('drop');
    if (z.dataset.zone === 'board') {
      const idx = boardIndexAt(e.clientX);
      const line = z.querySelector('.boardline');
      const pieces = [...line.querySelectorAll('.piece:not(.dragging)')];
      const mark = document.createElement('div'); mark.className = 'ins';
      if (pieces[idx]) line.insertBefore(mark, pieces[idx]); else if (pieces.length) pieces[pieces.length - 1].after(mark); else line.prepend(mark);
    }
  }
}, { passive: false });

// ---------- 交战回放：撞击、受击、特效、飘字、语音 ----------
function frameFx(prev, cur) {
  const fx = {}, sounds = new Set(), nums = {};
  const add = (uid, k) => { (fx[uid] = fx[uid] || []).push(k); };
  const hl = cur.hl || {};
  const before = new Map((prev ? prev.sides.flat() : []).map(u => [u.uid, u]));
  const hurt = [];
  cur.sides.flat().forEach(u => {
    const p = before.get(u.uid);
    if (!p) { if (prev) { add(u.uid, '召唤'); sounds.add('召唤物'); } return; }
    if (u.hp < p.hp) { hurt.push(u.uid); nums[u.uid] = { n: u.hp - p.hp }; }
    if (u.hp > p.hp) { add(u.uid, '回复'); nums[u.uid] = { n: u.hp - p.hp, heal: true }; sounds.add('回复'); }
    if (u.shield > p.shield) { add(u.uid, '护盾'); sounds.add('护盾'); }
    if (p.shield > 0 && u.shield === 0) { add(u.uid, '护盾破碎_序列'); sounds.add('护盾破碎'); }
    if (u.invul < p.invul) { add(u.uid, '无敌'); sounds.add('无敌'); }
    if (u.guts < p.guts) { add(u.uid, '毅力'); sounds.add('毅力'); }
    if (u.atk < p.atk && u.hp > 0) { add(u.uid, '削弱'); sounds.add('削弱'); }
    if (u.stun > p.stun) { add(u.uid, '眩晕'); sounds.add('眩晕'); }
  });
  const aoe = hurt.length >= 3;
  hurt.forEach(uid => add(uid, aoe ? '爆炸_序列' : '冲击'));
  if (hurt.length) sounds.add(aoe ? '爆炸' : '命中');
  if (hl.t && hl.a) add(hl.t, '斩击_序列');
  if (hl.np) add(hl.np, '宝具光_序列');
  if (hl.dead) { add(hl.dead, '消散_序列'); sounds.add('阵亡'); }
  if (/回避/.test(cur.msg)) sounds.add('回避');
  return { fx, sounds: [...sounds].slice(0, 3), nums };
}
function renderBattle() {
  const i = Math.min(replay.idx, replay.frames.length - 1);

  const me = replay.side, foe = 1 - me;

  const done = replay.idx >= replay.frames.length - 1;

        ${done ? `<div class="report">${hostState.on && hostState.text && curHost() ? `<div class="hostline"><img src="${hostImg(curHost())}" alt="" referrerpolicy="no-referrer"><span>${esc(hostState.text)}</span></div>` : ''}${replay.summary}<div class="row" style="margin-top:8px"><button class="img primary" data-act="continue">${G.over ? '查看结果' : '进入下一回合'}</button></div></div>` : ''}

function animateFrame(fr, prev, hl) {

  // 特效与飘字在撞上的那一刻出现；特效挂在桌面这一层，用滤色去掉黑底

    const hb = host.getBoundingClientRect();
    const dur = `${(0.55 / spd).toFixed(2)}s`;
    for (const [uid, list] of Object.entries(fx)) {
      const el = pieceEl(uid);
      if (!el) continue;
      const r = el.querySelector('.sq').getBoundingClientRect();
      const s = r.width * 1.7;
      list.slice(-2).forEach(k => {
        const d = document.createElement('div');
        d.className = 'fx' + (k.endsWith('_序列') ? ' seq' : '');
        Object.assign(d.style, { left: `${r.left - hb.left + r.width / 2 - s / 2}px`, top: `${r.top - hb.top + r.height / 2 - s / 2}px`, width: `${s}px`, height: `${s}px`, backgroundImage: `url(${A}fx/${k}.webp)` });
        d.style.setProperty('--d', dur);
        host.appendChild(d);

    }
    for (const [uid, v] of Object.entries(nums)) {
      const el = pieceEl(uid);
      if (!el) continue;
      const d = document.createElement('div');
      d.className = 'dmg' + (v.heal ? ' heal' : '');
      d.textContent = v.heal ? `+${v.n}` : v.n;
      d.style.setProperty('--d', `${(0.75 / spd).toFixed(2)}s`);

}

// ---------- 操作 ----------
function startGame() {
  const v = id => document.getElementById(id).value;
  const contracts = CTX ? [] : ['c1', 'c2', 'c3'].map(v).filter(Boolean);
  const seedStr = v('seed');
  const pick = document.querySelector('input[name=host]:checked');
  if (pick) { hostState.id = pick.value; store.set('host', pick.value); }
  hostState.on = document.getElementById('hostOn').checked; store.set('hostOn', hostState.on);
  const pact = PACT.filter(p => p.key);
  G = CTX
    ? C.newGame({ seed: seedStr ? Number(seedStr) : undefined, skill: v('skill'), name: CTX.master || '御主', contracts: pact.slice(0, 3).map(p => p.key), affection: pact.slice(0, 3).filter(p => p.aff >= 60).map(p => p.key), rivals: pact.map(p => p.key), staff: CTX.staff })
    : C.newGame({ seed: seedStr ? Number(seedStr) : undefined, skill: v('skill'), contracts, affection: document.getElementById('aff').checked });
  P = G.players[0];
  G.startedAt = Date.now(); G.myLog = []; G.npCount = {};

function endPrep() {
  if (P.pendingDiscover) return toast('先选一张圣杯奖励');
  if (P.pendingSame) return toast('先选同貌合成的结果');
  if (P.mana >= 3) hostSay('剩魔力');
  const round = G.round;
  const names = G.players.map(p => p.name);
  const results = C.endRound(G);
  const mine = results.find(r => r.a === 0 || r.b === 0);
  sel = null; mode = null;
  if (!mine || !mine.frames) { render(); return; }
  const side = mine.a === 0 ? 0 : 1;
  const oppId = side === 0 ? mine.b : mine.a;
  const oppName = oppId === 'ghost' ? (G.ghost ? G.ghost.name : '残影') : names[oppId];
  const won = mine.winner === side, draw = mine.winner === null;
  const lr = P.lastResult || {};
  const summary = draw ? '平局，双方都不扣体力。' : won ? `你赢了，${esc(oppName)} 扣 ${mine.dmg} 点体力。` : `你输了，扣 ${lr.dmg || 0} 点体力。`;
  const others = results.filter(r => r !== mine && r.frames).map(r => `${names[r.a]} ${r.winner === 0 ? '胜' : r.winner === 1 ? '负' : '平'} ${r.b === 'ghost' ? '残影' : names[r.b]}`).join('；');
  const endSound = G.over ? (P.place === 1 ? '冠军' : '出局') : draw ? '平局' : won ? '胜利' : (P.alive ? '失败' : '出局');

  if (G.npCount) mine.frames.forEach(f => { const m = /^(.+?) 发动宝具/.exec(f.msg); if (m && mineKeys.has(m[1])) G.npCount[m[1]] = (G.npCount[m[1]] || 0) + 1; });
  const names2 = []; names2[side] = names[0]; names2[1 - side] = oppName;
  replay = { frames: mine.frames, idx: 0, side, oppId, speed: store.get('speed', 1), round, names: names2, endSound,
    summary: `<b>${summary}</b>${mine.aborted ? `（${esc(mine.aborted)}）` : ''}<div class="muted">其他对局：${esc(others || '无')}</div>` };
  renderBattle();
  replay.timer = setTimeout(stepReplay, 600);
}

    case 'closeSel': sel = null; break;
    case 'buySel': { const r = C.buy(G, P, sel.shop); if (result(r, r && r.gold ? '三合一' : '购买')) { sel = null; afterBuy(r); if (r.unit && P.bench.includes(r.unit) && P.board.length < 7) deployWithVoice(r.unit); } break; }
    case 'sealBuy': if (result(C.useSeal(G, P, '立刻召唤', sel.shop), '令咒')) { sel = null; hostSay('令咒'); const nu = P.bench[P.bench.length - 1]; if (nu && P.board.length < 7) deployWithVoice(nu); } break;
    case 'refresh': if (result(C.refresh(G, P), '刷新')) { hostState.refreshes++; hostSay(hostState.refreshes >= 4 ? '连刷' : '刷新'); } sel = null; break;
    case 'freeze': C.toggleFreeze(G, P); play('固定'); if (P.frozen) hostSay('固定'); break;
    case 'upgrade': if (result(C.upgrade(G, P), '升级')) hostSay('升级'); break;
    case 'absolute': if (result(C.useSeal(G, P, '绝对命令'), '令咒')) hostSay('令咒'); break;
    case 'useCE': {
      const r = sel.ce !== undefined ? C.buyCE(G, P, sel.ce) : C.castCE(G, P, sel.hand);
      if (result(r, '礼装')) { sel = null; hostSay('礼装'); }
      break;
    }
    case 'storeCE': if (result(C.storeCE(G, P, sel.ce), '礼装')) sel = null; break;
    case 'skill': {
      const sk = C.SKILLS.find(s => s.n === P.skill);
      if (!sk.target) { result(C.useSkill(G, P), '技能'); break; }
      mode = mode === 'skill' ? null : 'skill'; play('点击'); break;
    }
    case 'up': if (u) deployWithVoice(u); break;
    case 'sell': if (u && result(C.sell(G, P, u.uid), '出售')) sel = null; break;
    case 'ascNp': if (u) { if (result(C.useSeal(G, P, '灵基升华', { uid: u.uid, route: 'np' }), '令咒')) { play('升华'); hostSay('升华'); } } break;
    case 'ascBody': if (u) { if (result(C.useSeal(G, P, '灵基升华', { uid: u.uid, route: 'body' }), '令咒')) { play('升华'); hostSay('升华'); } } break;
    case 'end': return endPrep();
  }
  render();
});
render();
</script>
